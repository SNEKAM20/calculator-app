<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nithilam.Tech - Flowy Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <img src="logo.png" alt="Nithilam Tech Logo" class="logo-img">
      <h1 class="brand-title">Nithilam.Tech</h1>
      <span class="badge-bar" id="versionBadge">Production (Version 1.0)</span>
    </div>

    <div class="input-group">
      <input type="number" id="num1" placeholder="Enter first integer">
      <input type="number" id="num2" placeholder="Enter second integer">
    </div>

    <button class="action-btn" id="calculateBtn">Add</button>

    <div class="output-section" id="outputSection">
      <div class="output-row">
        <strong>Answer: </strong><span id="answerText">--</span>
      </div>
      <div class="output-row">
        <strong>Check: </strong><span id="checkText">--</span>
      </div>

      <div class="update-box" id="updateBox">
        <button class="update-btn" id="updateBtn">Update to Version 1.0.1 (Fix Negative Integers)</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
